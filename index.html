<!-- PKM Engine — ระบบจัดการความรู้ส่วนตัว (single-user MVP) -->
<!-- Data model ออกแบบให้ map ตรงกับ Google Sheet schema เพื่อย้าย backend ภายหลัง -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --line:#E7E9EE; --line-2:#D6D9E0;
    --ink:#171B24; --ink-2:#5A6270; --ink-3:#9AA0AB;
    --brand:#4B3FE0; --brand-ink:#332AB0; --brand-bg:#EBEAFD; --brand-h:#3E33C8;
    --alert:#E0483A; --alert-bg:#FCEBE9;
    --s-inbox:#5A6270; --s-inbox-bg:#EEF0F3;
    --s-planned:#5B4BD8; --s-planned-bg:#EBE9FB;
    --s-learning:#D98A0E; --s-learning-bg:#FBF0DA;
    --s-distilled:#0F9E77; --s-distilled-bg:#DEF4EC;
    --s-active:#4AA52E; --s-active-bg:#E7F4DE;
    --r:10px; --r-sm:7px;
    --shadow:0 1px 2px rgba(20,25,35,.04),0 2px 8px rgba(20,25,35,.05);
  }
  :root[data-theme="dark"]{
    --bg:#151A22; --surface:#1E2530; --line:#2C3340; --line-2:#3A4250;
    --ink:#E8ECF2; --ink-2:#98A2B3; --ink-3:#6E7787;
    --brand:#7C86FF; --brand-ink:#B9C0FF; --brand-bg:#28304A; --brand-h:#9AA2FF;
    --alert:#FF6B57; --alert-bg:#3A2622;
    --s-inbox:#98A2B3; --s-inbox-bg:#262E3A;
    --s-planned:#A9A0FF; --s-planned-bg:#2A2A4A;
    --s-learning:#E6B24A; --s-learning-bg:#3A2E14;
    --s-distilled:#3FD3A6; --s-distilled-bg:#123A2E;
    --s-active:#8FD46A; --s-active-bg:#20361A;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  .mono{font-family:"IBM Plex Mono",monospace;font-feature-settings:"tnum"}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}

  /* ---- header ---- */
  header{background:var(--surface);border-bottom:1px solid var(--line);
    padding:0 22px;display:flex;align-items:center;gap:20px;height:60px;
    position:sticky;top:0;z-index:20}
  .logo{display:flex;align-items:center;gap:10px}
  .logo b{font-weight:600;font-size:17px;letter-spacing:-.2px}
  .brand-badge{display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;
    font-weight:600;font-size:13px;letter-spacing:.5px;cursor:default}
  :root[data-theme="dark"] .brand-badge{color:#16203A}
  nav{display:flex;gap:2px;margin-left:6px}
  nav button{padding:8px 15px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-2)}
  nav button:hover{background:var(--bg)}
  nav button.on{background:var(--brand-bg);color:var(--brand-ink)}
  .spacer{flex:1}
  .due-pill{display:none;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;
    background:var(--alert-bg);color:var(--alert);font-size:13px;font-weight:500}
  .due-pill.show{display:flex}
  .due-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--alert)}
  .sync-pill{display:none;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
  .sync-pill.show{display:block}
  .sync-pill.busy{background:var(--brand-bg);color:var(--brand-ink)}
  .sync-pill.ok{background:var(--s-active-bg);color:var(--s-active)}
  .sync-pill.err{background:var(--alert-bg);color:var(--alert)}
  .btn-add{background:var(--brand);color:#fff;padding:9px 16px;border-radius:var(--r-sm);
    font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
  .btn-add:hover{background:var(--brand-h)}
  .btn-theme{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:var(--r-sm);color:var(--ink-2);border:1px solid var(--line)}
  .btn-theme:hover{background:var(--bg);color:var(--ink);border-color:var(--line-2)}
  .ic-sun{display:none}
  :root[data-theme="dark"] .ic-moon{display:none}
  :root[data-theme="dark"] .ic-sun{display:block}

  main{padding:22px}
  .view{display:none}
  .view.on{display:block}

  /* ---- board ---- */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px}
  .col{flex:0 0 262px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 130px)}
  .col-head{padding:13px 14px 11px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:var(--r) var(--r) 0 0}
  .col-dot{width:9px;height:9px;border-radius:3px}
  .col-head b{font-weight:600;font-size:14px}
  .col-head .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);
    background:var(--bg);padding:1px 8px;border-radius:10px;font-weight:500}
  .wip-tag{font-size:11px;color:var(--ink-3);font-weight:500;padding:1px 7px;border-radius:10px;background:var(--bg)}
  .wip-tag.full{background:var(--alert-bg);color:var(--alert)}
  .col-over{border-color:var(--alert)}
  .col-body.drag-blocked{background:var(--alert-bg);cursor:not-allowed}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:var(--r-sm);
    font-size:13.5px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .col-body{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1}
  .col-empty{color:var(--ink-3);font-size:13px;text-align:center;padding:24px 8px;line-height:1.5}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:var(--line-2)}
  .card.due{border-left:3px solid var(--alert)}
  .card-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .card-id{font-size:11px;color:var(--ink-3);font-weight:500}
  .prio{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .prio.high{background:var(--alert)} .prio.med{background:#E0A32E} .prio.low{background:var(--line-2)}
  .card-title{font-weight:500;font-size:14px;line-height:1.4;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--ink-3)}
  .card-meta .src{text-transform:capitalize}
  .src-link{text-transform:capitalize;color:var(--brand);text-decoration:none;font-weight:500}
  .src-link:hover{text-decoration:underline}
  .url-row{display:flex;gap:8px;align-items:center}
  .url-row input{flex:1}
  .btn-open-url{display:inline-flex;align-items:center;gap:4px;padding:9px 14px;
    border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);
    color:var(--brand);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
  .btn-open-url:hover{border-color:var(--brand);background:var(--brand-bg)}
  /* attachments (multi-link) */
  .att-list{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
  .att-empty{font-size:12.5px;color:var(--ink-3);padding:8px 10px;background:var(--bg);border-radius:var(--r-sm);text-align:center}
  .att-row{display:grid;grid-template-columns:170px 1fr auto auto;gap:6px;align-items:center}
  .att-row .att-thumb{grid-column:1/-1;display:block;margin-top:2px;border-radius:var(--r-sm);
    overflow:hidden;border:1px solid var(--line);background:var(--bg);max-width:280px}
  .att-row .att-thumb img{display:block;width:100%;max-height:180px;object-fit:cover}
  .att-row .att-thumb:hover{border-color:var(--brand)}
  .att-row input{padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);
    background:var(--surface);outline:none;font-size:13px}
  .att-row input:focus{border-color:var(--brand)}
  .att-open{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
    border-radius:var(--r-sm);border:1px solid var(--line-2);color:var(--brand);
    text-decoration:none;font-size:14px;font-weight:500}
  .att-open:hover{border-color:var(--brand);background:var(--brand-bg)}
  .att-open.off{color:var(--ink-3);pointer-events:none;opacity:.5}
  .att-del{width:32px;height:32px;border-radius:var(--r-sm);color:var(--ink-3);
    font-size:18px;font-weight:400;line-height:1}
  .att-del:hover{background:var(--alert-bg);color:var(--alert)}
  .btn-add-att{padding:8px 14px;border:1px dashed var(--line-2);border-radius:var(--r-sm);
    color:var(--ink-2);font-size:13px;font-weight:500;width:100%}
  .btn-add-att:hover{border-color:var(--brand);color:var(--brand);border-style:solid}
  .att-badge{font-size:11px;color:var(--ink-2);font-weight:500;background:var(--bg);padding:1px 6px;border-radius:8px;margin-left:2px}
  .type-icon{font-size:12px;line-height:1}
  .ntbl td.nowrap{white-space:nowrap}
  .att-badge-sm{font-size:11px;color:var(--ink-2);font-weight:500}
  @media(max-width:640px){.att-row{grid-template-columns:1fr auto auto}.att-row .att-label{grid-column:1/-1}}
  .card-due-tag{color:var(--alert);font-weight:500}
  .card-nav{display:flex;gap:4px;margin-top:9px;opacity:0;transition:opacity .12s}
  .card:hover .card-nav{opacity:1}
  .card[draggable="true"]{cursor:grab}
  .card[draggable="true"]:active{cursor:grabbing}
  .card.dragging{opacity:.35;transform:scale(.97);transition:opacity .15s,transform .15s}
  .col-body.drag-over{background:var(--brand-bg);border-radius:0 0 var(--r) var(--r);transition:background .12s}
  .drop-indicator{height:3px;border-radius:2px;background:var(--brand);margin:2px 0;transition:opacity .1s}
  .card-nav button{flex:1;font-size:11px;padding:4px;border-radius:5px;background:var(--bg);
    color:var(--ink-2);font-weight:500}
  .card-nav button:hover{background:var(--line)}
  .card-nav button:disabled{opacity:.35;cursor:default}
  .link-badge{font-size:11px;color:var(--brand);font-weight:500}

  /* ---- review ---- */
  .review-wrap{max-width:560px;margin:10px auto}
  .rev-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .rev-head h2{margin:0;font-size:18px;font-weight:600}
  .rev-prog{font-size:13px;color:var(--ink-2)}
  .flashcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:28px 26px;min-height:230px;display:flex;flex-direction:column}
  .fc-id{font-size:12px;color:var(--ink-3);margin-bottom:14px}
  .fc-q{font-size:20px;font-weight:600;line-height:1.45;margin-bottom:6px}
  .fc-src{font-size:13px;color:var(--ink-3);margin-bottom:18px}
  .fc-answer{border-top:1px dashed var(--line-2);padding-top:16px;margin-top:4px}
  .fc-answer h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
  .fc-answer p{margin:0 0 12px;font-size:15px}
  .fc-tech{background:var(--s-learning-bg);color:var(--s-learning);padding:8px 12px;border-radius:var(--r-sm);
    font-size:14px;display:inline-block}
  .reveal-btn{margin-top:auto;align-self:flex-start;background:var(--brand-bg);color:var(--brand-ink);
    padding:10px 20px;border-radius:var(--r-sm);font-weight:500;font-size:14px}
  .grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
  .grade{padding:12px 6px;border-radius:var(--r-sm);font-weight:500;font-size:14px;
    border:1px solid var(--line);background:var(--surface);text-align:center}
  .grade small{display:block;font-size:11px;color:var(--ink-3);font-weight:400;margin-top:2px}
  .grade:hover{border-color:var(--line-2)}
  .grade.again:hover{background:var(--alert-bg);border-color:var(--alert)}
  .grade.hard:hover{background:var(--s-learning-bg);border-color:var(--s-learning)}
  .grade.good:hover{background:var(--s-distilled-bg);border-color:var(--s-distilled)}
  .grade.easy:hover{background:var(--s-active-bg);border-color:var(--s-active)}
  .rev-empty{text-align:center;padding:60px 20px;color:var(--ink-2)}
  .rev-empty .big{font-size:40px;margin-bottom:10px}

  /* ---- stats ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .stat .n{font-size:30px;font-weight:600;line-height:1;font-family:"IBM Plex Mono",monospace}
  .stat .l{font-size:13px;color:var(--ink-2);margin-top:7px}
  .stat.alert .n{color:var(--alert)}
  .stat.tint-brand{background:var(--brand-bg);border-color:transparent} .stat.tint-brand .n{color:var(--brand)}
  .stat.tint-alert{background:var(--alert-bg);border-color:transparent} .stat.tint-alert .n{color:var(--alert)}
  .stat.tint-green{background:var(--s-active-bg);border-color:transparent} .stat.tint-green .n{color:var(--s-active)}
  .stat.tint-purple{background:var(--s-planned-bg);border-color:transparent} .stat.tint-purple .n{color:var(--s-planned)}
  .stat.tint-brand .l,.stat.tint-alert .l,.stat.tint-green .l,.stat.tint-purple .l{color:var(--ink-2)}
  .stat-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .stat-2col .panel{margin-bottom:16px}
  .bar-row.compact .bar-label{width:78px;font-size:12px}
  .bar-row.compact .bar-val{width:auto;min-width:52px;font-size:12px}
  @media(max-width:640px){.stat-2col{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
  .panel h3{margin:0 0 14px;font-size:15px;font-weight:600}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .bar-label{width:110px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
  .bar-track{flex:1;height:22px;background:var(--bg);border-radius:5px;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;transition:width .4s}
  .bar-val{width:34px;text-align:right;font-size:13px;font-weight:500;font-family:"IBM Plex Mono",monospace}
  .used-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .used-row:last-child{border:none}
  .used-row .u-title{flex:1;font-size:14px}
  .used-row .u-n{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--brand)}
  /* review forecast chart */
  .fc-chart{display:flex;align-items:flex-end;gap:5px;height:140px}
  .fc-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .fc-bar{width:100%;max-width:36px;min-height:3px;border-radius:4px 4px 0 0;background:var(--brand)}
  .fc-bar.over{background:var(--alert)}
  .fc-bar.today{background:var(--s-distilled)}
  .fc-n{font-size:11px;font-weight:500;color:var(--ink-2);margin-bottom:3px;min-height:14px}
  .fc-xrow{display:flex;gap:5px;margin-top:6px}
  .fc-x{flex:1;text-align:center;font-size:10px;color:var(--ink-3)}
  .fc-hint{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.5}

  /* ---- all-notes tab ---- */
  .dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
    cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .dcard:hover{border-color:var(--line-2)}
  .dcard.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .dcard.alert.on{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert)}
  .dcard .dn{font-size:26px;font-weight:600;line-height:1;font-family:"IBM Plex Mono",monospace}
  .dcard .dl{font-size:12.5px;color:var(--ink-2);margin-top:6px}
  .dcard.alert .dn{color:var(--alert)}
  .toolbar{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .search-box{flex:1;min-width:220px;position:relative;display:flex;align-items:center}
  .search-box i{position:absolute;left:11px;font-style:normal;font-size:13px;opacity:.5}
  .search-box input{width:100%;padding:9px 11px 9px 32px;border:1px solid var(--line-2);
    border-radius:var(--r-sm);background:var(--surface);outline:none}
  .search-box input:focus{border-color:var(--brand)}
  .toolbar select{padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);
    background:var(--surface);outline:none;font-size:13px;cursor:pointer}
  .toolbar select:focus{border-color:var(--brand)}
  .btn-clear{padding:9px 14px;border:1px solid var(--line-2);border-radius:var(--r-sm);
    background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
  .btn-clear:hover{border-color:var(--alert);color:var(--alert);background:var(--alert-bg)}
  .tbl-count{font-size:12px;color:var(--ink-3);margin-bottom:8px}
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
  .ntbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .ntbl thead th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;
    padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
  .ntbl th.srt{cursor:pointer;user-select:none}
  .ntbl th.srt:hover{color:var(--ink)}
  .ntbl th.srt.on{color:var(--brand)}
  .ntbl tbody tr{cursor:pointer;border-bottom:1px solid var(--line)}
  .ntbl tbody tr:last-child{border-bottom:none}
  .ntbl tbody tr:hover{background:var(--bg)}
  .ntbl td{padding:10px 12px;vertical-align:middle}
  .ntbl td.mono,.ntbl td .mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
  .ntbl td.muted{color:var(--ink-3)}
  .ntbl td.t-title{font-weight:500;color:var(--ink);max-width:280px}
  .ntbl td.cap{text-transform:capitalize;color:var(--ink-2)}
  .badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
  .tbl-empty{text-align:center;color:var(--ink-3);padding:32px!important}
  @media(max-width:640px){.dash{grid-template-columns:repeat(2,1fr)}}

  /* ---- modal ---- */
  .overlay{display:none;position:fixed;inset:0;background:rgba(20,25,35,.4);z-index:50;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:720px;
    box-shadow:0 12px 40px rgba(20,25,35,.2);padding:0}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:2;background:var(--brand-bg);padding:18px 24px 14px;
    border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
  .modal-head .head-left h2{margin:0;font-size:18px;font-weight:600}
  .modal-head .head-left .sub{color:var(--ink-3);font-size:13px;margin:2px 0 0}
  .modal-head .head-btns{display:flex;gap:8px;flex-shrink:0}
  .modal-body{padding:18px 24px 24px}
  .modal h2{margin:0 0 4px;font-size:18px;font-weight:600}
  .modal .sub{color:var(--ink-3);font-size:13px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:5px}

<script>
/* ============ config: pipeline states (Kanban) ============ */
const STATES = [
  {key:'inbox',     label:'เข้าใหม่',    color:'var(--s-inbox)',     bg:'var(--s-inbox-bg)'},
  {key:'planned',   label:'วางแผนแล้ว',  color:'var(--s-planned)',   bg:'var(--s-planned-bg)'},
  {key:'learning',  label:'กำลังเรียน',  color:'var(--s-learning)',  bg:'var(--s-learning-bg)'},
  {key:'distilled', label:'สรุปแล้ว',    color:'var(--s-distilled)', bg:'var(--s-distilled-bg)'},
  {key:'active',    label:'พร้อมใช้',    color:'var(--s-active)',    bg:'var(--s-active-bg)'},
];
const stateIndex = k => STATES.findIndex(s=>s.key===k);
const REVIEWABLE = ['distilled','active']; // เริ่ม spaced repetition เมื่อถึงขั้นนี้
const SHORT = {inbox:'ใหม่', planned:'วางแผน', learning:'เรียน', distilled:'สรุป', active:'ใช้'};

/* ประเภทโน้ต — เพิ่ม/แก้ได้ตรงนี้ (key ต้องไม่ซ้ำ) */
const NOTE_TYPES = [
  {key:'overview',  label:'สรุปภาพรวม', icon:'📋'},
  {key:'technique', label:'เทคนิค',      icon:'⚙️'},
  {key:'idea',      label:'ไอเดีย',      icon:'💡'},
  {key:'reference', label:'อ้างอิง',     icon:'📖'},
];
const typeOf = k => NOTE_TYPES.find(t=>t.key===k);

/* WIP Limit — แก้ตัวเลขตรงนี้บรรทัดเดียว ไม่กระทบ Sheet/API */
const WIP_LIMIT = { planned: 10, learning: 3 };

/* เช็คว่าคอลัมน์รับการ์ดเพิ่มได้ไหม (hard limit) */
function canAccept(targetKey, movingNoteId){
  const limit=WIP_LIMIT[targetKey]; if(!limit) return true;
  const count=notes.filter(n=>n.status===targetKey && n.id!==movingNoteId).length;
  return count < limit;
}
let toastTimer=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.className='toast show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.className='toast', 2200);
}

/* ============================================================
   API CONFIG — ใส่ค่าจากขั้นที่ 5-7 ใน DEPLOY.md
   เว้นว่างทั้งคู่ = ทำงานแบบเดิม (เก็บในเครื่อง) ใช้ทดสอบได้
   ============================================================ */
const API = {
  url:   'https://script.google.com/macros/s/AKfycbwg7NVemEMRi-JM5MQTQUIKei7Y7ClrJRQkHrTrA1axzuUt_mBWux7GS3vSGwCfS_UC/exec',
  token: 'wb-pkm-192519',
};
const useAPI = () => !!(API.url && API.token);

/* ============ storage layer (Sheet API หรือ local storage) ============ */
const KEY_NOTES='pkm:notes', KEY_SEQ='pkm:seq', KEY_THEME='pkm:theme';
let notes=[], seq=0;

/* สถานะ sync มุมขวาบน */
let syncTimer=null;
function setSync(state, msg){
  const el=document.getElementById('syncPill'); if(!el) return;
  el.className='sync-pill show '+state;
  el.textContent=msg;
  clearTimeout(syncTimer);
  if(state==='ok') syncTimer=setTimeout(()=>el.classList.remove('show'), 1800);
}

/* POST เป็น text/plain เพื่อเลี่ยง CORS preflight (token อยู่ใน body ไม่ใช่ header) */
async function apiPost(payload){
  const res=await fetch(API.url,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({token:API.token}, payload))
  });
  const data=await res.json();
  if(!data.ok) throw new Error(data.error||'API error');
  return data;
}
async function apiGet(action){
  const res=await fetch(API.url+'?action='+encodeURIComponent(action)+'&token='+encodeURIComponent(API.token));
  const data=await res.json();
  if(!data.ok) throw new Error(data.error||'API error');
  return data;
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');
}
async function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  const next=cur==='dark'?'light':'dark';
  applyTheme(next);
  try{ await window.storage.set(KEY_THEME, next); }catch(e){}
}
async function loadTheme(){
  try{ const r=await window.storage.get(KEY_THEME); applyTheme(r?r.value:'light'); }
  catch(e){ applyTheme('light'); }
}

async function loadData(){
  if(useAPI()){
    setSync('busy','กำลังโหลดจาก Sheet…');
    try{
      const d=await apiGet('list');
      notes=d.notes||[];
      setSync('ok','โหลดแล้ว '+notes.length+' โน้ต');
    }catch(e){
      console.error(e);
      notes=[];
      setSync('err','เชื่อม Sheet ไม่สำเร็จ: '+e.message);
    }
  }else{
    try{ const r=await window.storage.get(KEY_NOTES); notes=r?JSON.parse(r.value):[]; }
    catch(e){ notes=[]; }
    try{ const s=await window.storage.get(KEY_SEQ); seq=s?parseInt(s.value):0; }
    catch(e){ seq=0; }
  }
  syncSeq();
}
/* seq = เลขสูงสุดที่มีจริง (Sheet ไม่ได้เก็บ counter แยก) */
function syncSeq(){
  const maxId=notes.reduce((m,n)=>{
    const num=parseInt(String(n.id||'').replace(/\D/g,''))||0; return num>m?num:m; },0);
  if(maxId>seq) seq=maxId;
}
/* optimistic: หน้าจออัปเดตไปแล้ว ตัวนี้แค่เขียนกลับเบื้องหลัง */
async function saveNotes(){
  if(useAPI()){
    setSync('busy','กำลังบันทึก…');
    try{ const d=await apiPost({action:'saveAll', notes}); setSync('ok','บันทึกแล้ว '+d.saved+' โน้ต'); }
    catch(e){ console.error(e); setSync('err','บันทึกไม่สำเร็จ: '+e.message); }
  }else{
    try{ await window.storage.set(KEY_NOTES, JSON.stringify(notes)); }
    catch(e){ console.error('save failed',e); alert('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); }
  }
}
async function saveSeq(){ if(useAPI()) return; try{ await window.storage.set(KEY_SEQ, String(seq)); }catch(e){} }
function newId(){ seq++; saveSeq(); return 'N'+String(seq).padStart(4,'0'); }
/* append-only log — ยิงเบื้องหลัง ไม่บล็อก UI */
function pushReviewLog(n, quality){
  if(!useAPI()) return;
  apiPost({action:'logReview', entry:{
    noteId:n.id, date:todayISO(), quality,
    efAfter:n.ef, intervalAfter:n.interval, nextReview:n.nextReview
  }}).catch(e=>console.error('log failed',e));
}

/* ============ date helpers (day-level, local) ============ */
const todayISO = ()=>{ const d=new Date(); return d.toISOString().slice(0,10); };
function addDaysISO(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/864e5); }
function isDue(n){
  if(!REVIEWABLE.includes(n.status)) return false;
  if(!n.nextReview) return true;              // ยังไม่เคยทบทวน = due ทันที
  return n.nextReview <= todayISO();
}
function dueLabel(n){
  if(!n.nextReview) return 'ทบทวนครั้งแรก';
  const d = daysBetween(todayISO(), n.nextReview);
  if(d<0) return 'เกิน '+(-d)+' วัน';
  if(d===0) return 'วันนี้';
  return 'อีก '+d+' วัน';
}

/* ============ SM-2 spaced repetition (quality 0-5) ============ */
function sm2(n, quality){
  let reps=n.reps||0, ef=n.ef||2.5, interval=n.interval||0;
  if(quality>=3){
    if(reps===0) interval=1;
    else if(reps===1) interval=6;
    else interval=Math.round(interval*ef);
    reps+=1;
  }else{ reps=0; interval=1; }
  ef = ef + (0.1 - (5-quality)*(0.08+(5-quality)*0.02));
  if(ef<1.3) ef=1.3;
  const last=todayISO();
  return { reps, ef:Math.round(ef*100)/100, interval,
           lastReview:last, nextReview:addDaysISO(last,interval), lastQuality:quality };
}

/* ============ views ============ */
let currentView='board';
function switchView(v){
  currentView=v;
  ['board','all','review','stats'].forEach(x=>{
    document.getElementById('view-'+x).classList.toggle('on', x===v);
    document.getElementById('nav-'+x).classList.toggle('on', x===v);
  });
  if(v==='board') renderBoard();
  if(v==='all') renderAll();
  if(v==='review') renderReview();
  if(v==='stats') renderStats();
}

function renderAlert(){
  const n = notes.filter(isDue).length;
  const pill=document.getElementById('duePill');
  if(n>0){ pill.classList.add('show'); document.getElementById('dueText').textContent='ถึงกำหนดทบทวน '+n+' รายการ'; }
  else pill.classList.remove('show');
}

/* ---- board ---- */
function renderBoard(){
  const board=document.getElementById('board'); board.innerHTML='';
  STATES.forEach((st,i)=>{
    const items=notes.filter(n=>n.status===st.key)
      .sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
    const limit=WIP_LIMIT[st.key]||0;
    const full=limit && items.length>=limit;
    const col=document.createElement('div'); col.className='col'+(full?' col-over':'');
    const limitTag=limit?`<span class="wip-tag${full?' full':''}">${items.length}/${limit}</span>`:'';
    col.innerHTML=`<div class="col-head"><span class="col-dot" style="background:${st.color}"></span>
      <b>${st.label}</b>${limitTag}<span class="cnt">${items.length}</span></div>
      <div class="col-body" id="cb-${st.key}"></div>`;
    board.appendChild(col);
    const body=col.querySelector('.col-body');
    if(!items.length){ body.innerHTML=`<div class="col-empty">— ว่าง —</div>`; }
    items.forEach(n=>body.appendChild(cardEl(n,i)));

    // drop zone events (ข้ามคอลัมน์ + เรียงในคอลัมน์)
    body.addEventListener('dragover', e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      const draggingId=document.querySelector('.card.dragging')?.dataset.id;
      const draggingNote=notes.find(x=>x.id===draggingId);
      const sameCol=draggingNote && draggingNote.status===st.key;
      // hard limit: บล็อก drop เมื่อ user ปล่อย + visual feedback (ยังต้อง preventDefault เพื่อให้ drop event ยิง)
      if(!sameCol && !canAccept(st.key, draggingId)){
        body.classList.add('drag-blocked');
        body.classList.remove('drag-over');
        removeIndicator(body);
        return;
      }
      body.classList.remove('drag-blocked');
      body.classList.add('drag-over');
      positionIndicator(body, e.clientY);
    });
    body.addEventListener('dragleave', e=>{
      if(!body.contains(e.relatedTarget)){
        body.classList.remove('drag-over','drag-blocked');
        removeIndicator(body);
      }
    });
    body.addEventListener('drop', async e=>{
      e.preventDefault();
      body.classList.remove('drag-over','drag-blocked');
      const noteId=e.dataTransfer.getData('text/plain');
      const n=notes.find(x=>x.id===noteId);
      if(!n){ removeIndicator(body); return; }

      // hard limit ที่ drop จริง (เผื่อ browser ที่ dropEffect='none' ไม่บล็อกให้)
      if(n.status!==st.key && !canAccept(st.key, n.id)){
        removeIndicator(body);
        toast(`คอลัมน์ "${STATES[i].label}" เต็มแล้ว (limit ${WIP_LIMIT[st.key]}) — เอาบางอันออกก่อน`);
        return;
      }

      // หา index ตำแหน่งวางจาก indicator
      const after=getAfterCard(body, e.clientY);
      removeIndicator(body);

      n.status=st.key;
      if(n.status==='planned' && !n.learnDate) n.learnDate=addDaysISO(todayISO(),1);

      // สร้างลำดับใหม่ของคอลัมน์นี้: เอาการ์ดเดิม (ไม่รวมตัวที่ลาก) แล้วแทรกตัวที่ลาก
      const colNotes=notes.filter(x=>x.status===st.key && x.id!==n.id)
        .sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
      const idx=after?colNotes.findIndex(x=>x.id===after.dataset.id)+1:0;
      colNotes.splice(after?idx:0, 0, n);
      // renumber 1..n เฉพาะคอลัมน์นี้
      colNotes.forEach((x,k)=>x.sortOrder=k+1);

      renderBoard();
      await saveNotes();
    });
  });
  renderAlert();
}
/* หา "การ์ดที่อยู่เหนือจุดวาง" — คืน null = วางบนสุด */
function getAfterCard(body, y){
  const cards=[...body.querySelectorAll('.card:not(.dragging)')];
  let after=null;
  for(const c of cards){
    const r=c.getBoundingClientRect();
    if(y > r.top + r.height/2) after=c;
  }
  return after;
}
function positionIndicator(body, y){
  let ind=body.querySelector('.drop-indicator');
  if(!ind){ ind=document.createElement('div'); ind.className='drop-indicator'; }
  const after=getAfterCard(body, y);
  if(after) after.after(ind);
  else body.prepend(ind);
}
function removeIndicator(body){
  const ind=body.querySelector('.drop-indicator'); if(ind) ind.remove();
}
function cardEl(n,colIdx){
  const el=document.createElement('div');
  el.className='card'+(isDue(n)?' due':'');
  el.draggable=true;
  el.dataset.id=n.id;
  const due=isDue(n)?`<span class="card-due-tag">● ทบทวน</span>`:'';
  const links=n.links&&n.links.length?`<span class="link-badge">↔ ${n.links.length}</span>`:'';
  const atts=n.attachments&&n.attachments.length?`<span class="att-badge" title="ลิงก์เสริม ${n.attachments.length} รายการ">📎 ${n.attachments.length}</span>`:'';
  const outs=n.outputs&&n.outputs.length?`<span class="att-badge" title="ผลงานที่สร้าง ${n.outputs.length} รายการ">✍️ ${n.outputs.length}</span>`:'';
  const t=typeOf(n.noteType);
  const typeIcon=t?`<span class="type-icon" title="${t.label}">${t.icon}</span>`:'';
  el.innerHTML=`
    <div class="card-top"><span class="prio ${n.priority}"></span>
      <span class="card-id mono">${n.id}</span>${typeIcon}${links}${atts}${outs}</div>
    <div class="card-title">${esc(n.title)}</div>
    <div class="card-meta">${n.url&&safeUrl(n.url)
      ? `<a class="src src-link" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener"
           onclick="event.stopPropagation()" title="เปิด: ${esc(n.url)}">${esc(n.source||'link')} ↗</a>`
      : `<span class="src">${esc(n.source||'—')}</span>`}${due}</div>
    <div class="card-nav">
      <button ${colIdx===0?'disabled':''} onclick="event.stopPropagation();move('${n.id}',-1)">←</button>
      <button ${colIdx===STATES.length-1?'disabled':''} onclick="event.stopPropagation();move('${n.id}',1)">→</button>
    </div>`;
  el.onclick=()=>openDetail(n.id);
  el.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', n.id);
    e.dataTransfer.effectAllowed='move';
    requestAnimationFrame(()=>el.classList.add('dragging'));
  });
  el.addEventListener('dragend', ()=>{
    el.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
    document.querySelectorAll('.drop-indicator').forEach(x=>x.remove());
  });
  return el;
}
async function move(id,dir){
  const n=notes.find(x=>x.id===id); if(!n) return;
  const i=stateIndex(n.status)+dir;
  if(i<0||i>=STATES.length) return;
  const target=STATES[i].key;
  if(!canAccept(target, n.id)){
    toast(`คอลัมน์ "${STATES[i].label}" เต็มแล้ว (limit ${WIP_LIMIT[target]}) — เอาบางอันออกก่อน`);
    return;
  }
  n.status=target;
  if(n.status==='planned' && !n.learnDate) n.learnDate=addDaysISO(todayISO(),1);
  const maxOrder=notes.filter(x=>x.status===n.status && x.id!==n.id)
    .reduce((m,x)=>Math.max(m,x.sortOrder||0),0);
  n.sortOrder=maxOrder+1;   // ต่อท้ายคอลัมน์ปลายทาง
  await saveNotes(); renderBoard();
}

/* ---- review (flashcard + SM-2) ---- */
let revQueue=[], revPos=0, revealed=false;
function renderReview(){
  revQueue=notes.filter(isDue); revPos=0; revealed=false;
  const w=document.getElementById('reviewWrap');
  if(!revQueue.length){
    w.innerHTML=`<div class="rev-empty"><div class="big">✓</div>
      <div style="font-weight:600;font-size:17px;color:var(--ink)">ไม่มีรายการถึงกำหนด</div>
      <div style="margin-top:6px">ทบทวนครบแล้ว กลับมาใหม่ตามวันนัดของแต่ละโน้ต</div></div>`;
    return;
  }
  drawCard();
}
function drawCard(){
  const w=document.getElementById('reviewWrap');
  if(revPos>=revQueue.length){ renderReview(); return; }
  const n=revQueue[revPos];
  const answer = revealed?`
    <div class="fc-answer">
      <h4>สรุป</h4>${n.summary?`<div class="md-prev" style="padding:0;background:none">${mdToHtml(n.summary)}</div>`:'<p style="color:var(--ink-3)">ยังไม่ได้จดสรุป</p>'}
      ${n.technique?`<h4>เทคนิคที่ประยุกต์ใช้</h4><span class="fc-tech">${esc(n.technique)}</span>`:''}
    </div>
    <div class="grade-row">
      <button class="grade again" onclick="grade(1)">ลืมแล้ว<small>เริ่มใหม่</small></button>
      <button class="grade hard" onclick="grade(3)">ยาก<small>+1 วัน</small></button>
      <button class="grade good" onclick="grade(4)">ได้<small>ปกติ</small></button>
      <button class="grade easy" onclick="grade(5)">ง่ายมาก<small>ยืดออก</small></button>
    </div>`
   :`<button class="reveal-btn" onclick="revealed=true;drawCard()">เปิดดูคำตอบ</button>`;
  w.innerHTML=`
    <div class="rev-head"><h2>ทบทวน</h2><span class="rev-prog">${revPos+1} / ${revQueue.length}</span></div>
    <div class="flashcard">
      <div class="fc-id mono">${n.id} · ${dueLabel(n)}${typeOf(n.noteType)?` · ${typeOf(n.noteType).icon} ${typeOf(n.noteType).label}`:''}</div>
      <div class="fc-q">${esc(n.title)}</div>
      <div class="fc-src">${n.url&&safeUrl(n.url)
        ? `<a class="src-link" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${esc(n.source||'link')} ↗</a>`
        : esc(n.source||'')}${n.category?' · '+esc(n.category):''}</div>
      ${answer}
    </div>`;
}
async function grade(q){
  const n=revQueue[revPos];
  Object.assign(n, sm2(n,q));
  pushReviewLog(n, q);
  await saveNotes();
  revPos++; revealed=false; drawCard(); renderAlert();
}

function renderStats(){
  const w=document.getElementById('statsWrap');

  const reviewedEver=notes.filter(n=>n.lastReview).length;
  const counts=STATES.map(st=>({...st,c:notes.filter(n=>n.status===st.key).length}));
  const maxC=Math.max(1,...counts.map(c=>c.c));
  const topUsed=[...notes].filter(n=>n.timesUsed>0).sort((a,b)=>b.timesUsed-a.timesUsed).slice(0,5);
  const totalLinks=notes.reduce((s,n)=>s+((n.links||[]).length),0);

  // Review Forecast: เกินกำหนด + วันนี้ + อีก 12 วัน

  for(let d=1;d<=DAYS;d++) fcBars.push({v:dayCounts[d],x:addDaysISO(t,d).slice(8,10),cls:'',title:addDaysISO(t,d)});
  const maxF=Math.max(1,...fcBars.map(b=>b.v)), fcTotal=overdue+dayCounts.reduce((a,b)=>a+b,0);

  w.innerHTML=`
    <div class="stat-grid">
      <div class="stat tint-brand"><div class="n">${total}</div><div class="l">โน้ตทั้งหมด</div></div>
      <div class="stat tint-alert"><div class="n">${due}</div><div class="l">ถึงกำหนดทบทวน</div></div>
      <div class="stat tint-green"><div class="n">${active}</div><div class="l">พร้อมใช้งาน</div></div>
      <div class="stat tint-purple"><div class="n">${totalLinks}</div><div class="l">การเชื่อมโยง (links)</div></div>
    </div>
    <div class="panel"><h3>คาดการณ์การทบทวน 14 วันข้างหน้า</h3>
      ${fcTotal?`<div class="fc-chart">
        ${fcBars.map(b=>`<div class="fc-col">
          <div class="fc-n">${b.v||''}</div>
          <div class="fc-bar ${b.cls}" style="height:${b.v/maxF*100}%" title="${b.title}: ${b.v} โน้ต"></div>
        </div>`).join('')}
      </div>
      <div class="fc-xrow">${fcBars.map(b=>`<div class="fc-x">${b.x}</div>`).join('')}</div>
      <div class="fc-hint">แท่งแดง = เกินกำหนด · เขียว = วันนี้ · ตัวเลขบนแกน = วันที่ · ดูล่วงหน้าเพื่อไม่ให้คิวถล่มวันเดียว</div>`
      :`<div style="color:var(--ink-3);font-size:14px">ยังไม่มีโน้ตในระบบทบทวน (ต้องถึงขั้น "สรุปแล้ว" ก่อน)</div>`}
    </div>
    <div class="stat-2col">
      <div class="panel"><h3>กระจายตาม pipeline state</h3>
        <div class="fc-chart">
          ${counts.map(c=>`<div class="fc-col">
            <div class="fc-n">${c.c||''}</div>
            <div class="fc-bar" style="height:${c.c/maxC*100}%;background:${c.color}" title="${c.label}: ${c.c}"></div>
          </div>`).join('')}
        </div>
        <div class="fc-xrow">${counts.map(c=>`<div class="fc-x">${SHORT[c.key]}</div>`).join('')}</div>
      </div>
      <div class="panel"><h3>กระจายตามหมวดหมู่</h3>
        ${catArr.length?catArr.map(([name,c])=>`<div class="bar-row compact">
          <div class="bar-label">${esc(name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${c/maxCat*100}%;background:var(--brand)"></div></div>
          <div class="bar-val">${c} · ${Math.round(c/total*100)}%</div></div>`).join('')
        :`<div style="color:var(--ink-3);font-size:14px">ยังไม่มีโน้ต</div>`}
      </div>
    </div>
    <div class="panel"><h3>สถิติการนำไปใช้ (top 5)</h3>
      ${topUsed.length?topUsed.map(n=>`<div class="used-row">
        <span class="card-id mono">${n.id}</span><span class="u-title">${esc(n.title)}</span>

/* ---- แท็บ "โน้ตทั้งหมด": dashboard A + search + filter + sortable table ---- */
let allState={ search:'', fStatus:'', fCategory:'', fSource:'', fType:'', quickDue:false, sortKey:'nextReview', sortDir:'asc' };
const SORTABLE={ nextReview:'ทบทวนถัดไป', created:'วันที่สร้าง', links:'↔', title:'หัวข้อ' };

function allFiltered(){
  let list=notes.slice();
  if(allState.quickDue) list=list.filter(isDue);
  if(allState.fStatus)  list=list.filter(n=>n.status===allState.fStatus);
  if(allState.fCategory)list=list.filter(n=>(n.category||'')===allState.fCategory);
  if(allState.fSource)  list=list.filter(n=>n.source===allState.fSource);
  if(allState.fType)    list=list.filter(n=>(n.noteType||'')===(allState.fType==='__none'?'':allState.fType));
  if(allState.search){ const q=allState.search.toLowerCase();
    list=list.filter(n=>(n.title||'').toLowerCase().includes(q)
      ||(n.category||'').toLowerCase().includes(q)||(n.summary||'').toLowerCase().includes(q)); }
  const dir=allState.sortDir==='asc'?1:-1, k=allState.sortKey;
  list.sort((a,b)=>{
    if(k==='nextReview'){ const av=a.nextReview,bv=b.nextReview;   // ค่าว่างลงท้ายเสมอ
      if(!av&&!bv) return 0; if(!av) return 1; if(!bv) return -1; return av.localeCompare(bv)*dir; }
    if(k==='created') return String(a.created||'').localeCompare(String(b.created||''))*dir;
    if(k==='links') return ((a.links||[]).length-(b.links||[]).length)*dir;
    if(k==='title') return String(a.title||'').localeCompare(String(b.title||''),'th')*dir;
    return 0;
  });
  return list;
}
function setQuick(mode){
  allState.search=''; allState.fStatus=''; allState.fCategory=''; allState.fSource=''; allState.fType=''; allState.quickDue=false;
  if(mode==='due') allState.quickDue=true;
  else if(mode==='inbox') allState.fStatus='inbox';
  else if(mode==='active') allState.fStatus='active';
  renderAll();
}
function activeCard(){
  if(allState.quickDue) return 'due';
  if(allState.fStatus==='inbox') return 'inbox';
  if(allState.fStatus==='active') return 'active';
  if(!allState.fStatus&&!allState.fCategory&&!allState.fSource&&!allState.fType&&!allState.search) return 'all';
  return '';
}
function onSort(k){
  if(allState.sortKey===k) allState.sortDir=allState.sortDir==='asc'?'desc':'asc';
  else { allState.sortKey=k; allState.sortDir = k==='links'?'desc':'asc'; }
  renderAll();
}
function onFilter(){
  allState.search=document.getElementById('a-search').value.trim();
  allState.fStatus=document.getElementById('a-status').value;
  allState.fCategory=document.getElementById('a-category').value;
  allState.fSource=document.getElementById('a-source').value;
  allState.fType=document.getElementById('a-type').value;
  allState.quickDue=false;
  renderAll();
}
function activeFilterCount(){
  return [allState.search,allState.fStatus,allState.fCategory,allState.fSource,allState.fType,allState.quickDue]
    .filter(Boolean).length;
}
function clearFilters(){   // ล้างแบบเบา: คง sort ไว้
  allState.search=''; allState.fStatus=''; allState.fCategory=''; allState.fSource=''; allState.fType=''; allState.quickDue=false;
  renderAll();
}
function reviewCell(n){
  if(!REVIEWABLE.includes(n.status)) return `<span style="color:var(--ink-3)">—</span>`;
  if(!n.nextReview) return `<span style="color:var(--alert);font-weight:500">ทบทวนครั้งแรก</span>`;
  const over=n.nextReview<todayISO();
  return `<span class="mono"${over?' style="color:var(--alert);font-weight:500"':''}>${n.nextReview}</span>
    <span style="font-size:11px;color:var(--ink-3)"> · ${dueLabel(n)}</span>`;
}
function renderAll(){
  const w=document.getElementById('allWrap');
  const total=notes.length, due=notes.filter(isDue).length;
  const inbox=notes.filter(n=>n.status==='inbox').length, active=notes.filter(n=>n.status==='active').length;

  w.innerHTML=`
    <div class="dash">
      <div class="dcard ${ac==='all'?'on':''}" onclick="setQuick('all')">

      <div class="dcard ${ac==='inbox'?'on':''}" onclick="setQuick('inbox')">
        <div class="dn">${inbox}</div><div class="dl">ค้างใน Inbox</div></div>
      <div class="dcard ${ac==='active'?'on':''}" onclick="setQuick('active')">
        <div class="dn">${active}</div><div class="dl">พร้อมใช้</div></div>
    </div>
    <div class="toolbar">
      <div class="search-box"><i>🔍</i><input id="a-search" value="${esc(allState.search)}"
        placeholder="ค้นหา หัวข้อ · หมวดหมู่ · เนื้อหาสรุป…" oninput="onFilter()"></div>
      <select id="a-status" onchange="onFilter()">
        <option value="">สถานะ: ทั้งหมด</option>
        ${STATES.map(s=>`<option value="${s.key}" ${allState.fStatus===s.key?'selected':''}>${s.label}</option>`).join('')}
      </select>
      <select id="a-category" onchange="onFilter()">
        <option value="">หมวด: ทั้งหมด</option>
        ${cats.map(c=>`<option value="${esc(c)}" ${allState.fCategory===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <select id="a-source" onchange="onFilter()">
        <option value="">แหล่ง: ทั้งหมด</option>
        ${srcs.map(s=>`<option value="${esc(s)}" ${allState.fSource===s?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <select id="a-type" onchange="onFilter()">
        <option value="">ประเภท: ทั้งหมด</option>
        ${NOTE_TYPES.map(t=>`<option value="${t.key}" ${allState.fType===t.key?'selected':''}>${t.icon} ${t.label}</option>`).join('')}
        <option value="__none" ${allState.fType==='__none'?'selected':''}>— ไม่ระบุ —</option>
      </select>
      ${activeFilterCount()?`<button class="btn-clear" onclick="clearFilters()">ล้างตัวกรอง (${activeFilterCount()})</button>`:''}
    </div>
    <div class="tbl-count">${rows.length} รายการ${rows.length!==total?` (จาก ${total})`:''}</div>
    <div class="tbl-wrap">
      <table class="ntbl">
        <thead><tr>
          <th>ID</th>
          ${th('title','หัวข้อ')}
          <th>ประเภท</th>
          <th>สถานะ</th>
          <th>หมวดหมู่</th>
          ${th('nextReview','ทบทวนถัดไป')}
          ${th('links','↔',' style="text-align:center"')}
          <th>แหล่งที่มา</th>
          ${th('created','วันที่สร้าง')}
        </tr></thead>
        <tbody>
          ${rows.length? rows.map(n=>{
            const st=STATES[stateIndex(n.status)];
            const nt=typeOf(n.noteType);
            return `<tr onclick="openDetail('${n.id}')">
              <td class="mono muted">${n.id}</td>
              <td class="t-title">${esc(n.title)}</td>
              <td class="nowrap">${nt?`${nt.icon} <span style="font-size:12.5px">${nt.label}</span>`:'<span style="color:var(--ink-3)">—</span>'}</td>
              <td><span class="badge" style="background:${st.bg};color:${st.color}">${st.label}</span></td>
              <td>${n.category?esc(n.category):'<span style="color:var(--ink-3)">—</span>'}</td>
              <td>${reviewCell(n)}</td>
              <td style="text-align:center" class="mono">${(n.links||[]).length||'<span style="color:var(--ink-3)">0</span>'}</td>
              <td class="cap">${n.url&&safeUrl(n.url)
                ? `<a class="src-link" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(n.source||'link')} ↗</a>`
                : esc(n.source||'—')}${n.attachments&&n.attachments.length?` <span class="att-badge-sm" title="ลิงก์เสริม ${n.attachments.length} รายการ">📎 ${n.attachments.length}</span>`:''}${n.outputs&&n.outputs.length?` <span class="att-badge-sm" title="ผลงานที่สร้าง ${n.outputs.length} รายการ">✍️ ${n.outputs.length}</span>`:''}</td>
              <td class="mono muted">${n.created||'—'}</td>

        </tbody>
      </table>

  renderAlert();

/* ============ modal: new / detail ============ */
let editingId=null, draftLinks=[], draftAtts=[], draftOuts=[];
function parseLinkField(arr){
  return (arr||[]).map(s=>{ const i=String(s).indexOf('\t');
    return i<0?{label:'',url:s}:{label:s.slice(0,i),url:s.slice(i+1)}; });
}
function openNew(){
  editingId=null; draftLinks=[]; draftAtts=[]; draftOuts=[];
  document.getElementById('modal').innerHTML=formHTML({priority:'med',source:'web'}, false);
  renderAtts(); renderLinkset('out');
  showModal(); updatePreview();
}
function openDetail(id){
  const n=notes.find(x=>x.id===id); if(!n) return;
  editingId=id; draftLinks=[...(n.links||[])];
  draftAtts=parseLinkField(n.attachments);
  draftOuts=parseLinkField(n.outputs);
  document.getElementById('modal').innerHTML=formHTML(n, true);
  renderLinks(); renderAtts(); renderLinkset('out');
  showModal(); updatePreview();
}
function formHTML(n, isEdit){
  const backlinks = isEdit ? notes.filter(x=>(x.links||[]).includes(n.id)) : [];
  // โน้ตแม่ (overview) → รวมโน้ตลูกจากทั้ง 2 ทิศทาง (links + backlinks) แยกตามประเภท
  const childGroups = (()=>{
    if(!isEdit || n.noteType !== 'overview') return [];
    const ids = new Set();
    (n.links||[]).forEach(id=>ids.add(id));

function renderLinks(){
  const box=document.getElementById('linksBox'); if(!box) return;
  box.innerHTML=draftLinks.map(id=>{
    const exists=notes.find(n=>n.id===id);
    return `<span class="link-chip">${id}${exists?'':' ⚠'}<span class="x" onclick="rmLink('${id}')">×</span></span>`;
  }).join('');
}
function addLink(){
  const inp=document.getElementById('f-linkinput');
  let v=inp.value.trim().toUpperCase(); if(!v) return;
  if(!/^N\d{4}$/.test(v)){ v='N'+v.replace(/\D/g,'').padStart(4,'0'); }
  if(v===editingId){ inp.value=''; return; }
  if(!draftLinks.includes(v)) draftLinks.push(v);
  inp.value=''; renderLinks();
}
function rmLink(id){ draftLinks=draftLinks.filter(x=>x!==id); renderLinks(); }

/* ระบบลิงก์แบบมีป้ายชื่อ ใช้ร่วมกัน 2 ชุด: att (แหล่งเสริม) + out (ผลงาน) */
const LINKSETS={
  att:{ get:()=>draftAtts, box:'attList',  empty:'ยังไม่มีลิงก์เสริม — กด "+ เพิ่มลิงก์" ด้านล่าง' },
  out:{ get:()=>draftOuts, box:'outList',  empty:'ยังไม่มีผลงาน — กด "+ เพิ่มผลงาน" ด้านล่าง' },
};
function renderLinkset(kind){
  const cfg=LINKSETS[kind]; const arr=cfg.get();
  const box=document.getElementById(cfg.box); if(!box) return;
  if(!arr.length){ box.innerHTML=`<div class="att-empty">${cfg.empty}</div>`; return; }
  box.innerHTML=arr.map((a,i)=>{
    const safe=safeUrl(a.url), img=imageUrlFrom(safe);
    return `<div class="att-row">
      <input class="att-label" placeholder="ป้ายชื่อ" value="${esc(a.label)}"
        oninput="onLinkChange('${kind}',${i},'label',this.value)">
      <input class="att-url" placeholder="https://…" value="${esc(a.url)}"
        oninput="onLinkChange('${kind}',${i},'url',this.value)">
      <a class="att-open ${safe?'':'off'}" ${safe?`href="${esc(safe)}" target="_blank" rel="noopener" title="เปิด"`:'aria-disabled="true"'}>↗</a>
      <button type="button" class="att-del" onclick="rmLinkItem('${kind}',${i})" title="ลบ">×</button>
      ${img?`<a class="att-thumb" href="${esc(safe)}" target="_blank" rel="noopener" title="เปิดรูปเต็ม">
        <img src="${esc(img)}" alt="preview" loading="lazy" onerror="this.parentElement.remove()">
      </a>`:''}
    </div>`;
  }).join('');
}
function addLinkItem(kind){
  LINKSETS[kind].get().push({label:'',url:''}); renderLinkset(kind);
  const rows=document.querySelectorAll('#'+LINKSETS[kind].box+' .att-row');
  if(rows.length) rows[rows.length-1].querySelector('.att-label').focus();
}
function rmLinkItem(kind,i){ LINKSETS[kind].get().splice(i,1); renderLinkset(kind); }
function onLinkChange(kind,i,key,val){
  const arr=LINKSETS[kind].get(); arr[i][key]=val;
  const rows=document.querySelectorAll('#'+LINKSETS[kind].box+' .att-row');
  const row=rows[i]; if(!row) return;
  const safe=safeUrl(arr[i].url);
  const btn=row.querySelector('.att-open');
  if(safe){ btn.className='att-open'; btn.href=safe; btn.setAttribute('target','_blank'); btn.setAttribute('rel','noopener'); btn.removeAttribute('aria-disabled'); }
  else { btn.className='att-open off'; btn.removeAttribute('href'); btn.setAttribute('aria-disabled','true'); }
  if(key==='url'){
    const oldThumb=row.querySelector('.att-thumb'); if(oldThumb) oldThumb.remove();
    const img=imageUrlFrom(safe);
    if(img){
      const a=document.createElement('a');
      a.className='att-thumb'; a.href=safe; a.target='_blank'; a.rel='noopener'; a.title='เปิดรูปเต็ม';
      a.innerHTML=`<img src="${esc(img)}" alt="preview" loading="lazy" onerror="this.parentElement.remove()">`;
      row.appendChild(a);
    }
  }
}
/* aliases เดิม (attachments) */
function renderAtts(){ renderLinkset('att'); }
/* คืน URL รูปที่ browser โหลดได้ ถ้าไม่ใช่รูป/ไม่รองรับ = '' */
function imageUrlFrom(u){
  if(!u) return '';
  // 1) นามสกุลรูปตรงๆ
  if(/\.(jpe?g|png|gif|webp|svg|bmp)(\?.*)?$/i.test(u)) return u;
  // 2) Google Drive: https://drive.google.com/file/d/FILE_ID/view?...
  const gd=u.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
  if(gd) return `https://drive.google.com/thumbnail?id=${gd[1]}&sz=w400`;
  // 3) Google Drive แบบ open?id=
  const gd2=u.match(/drive\.google\.com\/open\?id=([^&]+)/);
  if(gd2) return `https://drive.google.com/thumbnail?id=${gd2[1]}&sz=w400`;
  // 4) Imgur direct
  if(/imgur\.com\/[a-zA-Z0-9]+$/.test(u) && !u.includes('/a/') && !u.includes('/gallery/'))
    return u.replace(/imgur\.com\/([a-zA-Z0-9]+)$/, 'i.imgur.com/$1.jpg');
  return '';
}

async function saveForm(){
  const g=id=>document.getElementById(id).value.trim();
  const title=g('f-title'); if(!title){ alert('กรุณาใส่หัวข้อ'); return; }
  const ser=arr=>arr

    .filter(a=>a.url)

  const atts=ser(draftAtts), outs=ser(draftOuts);
  const data={ title, source:g('f-source'), priority:g('f-priority'), url:g('f-url'),
    category:g('f-category'), summary:g('f-summary'), technique:g('f-technique'),
    links:[...draftLinks], attachments:atts, noteType:g('f-noteType'), outputs:outs };

    const n=notes.find(x=>x.id===editingId); Object.assign(n,data);
  }else{
    const maxOrder=notes.filter(x=>x.status==='inbox')
      .reduce((m,x)=>Math.max(m,x.sortOrder||0),0);

      reps:0, ef:2.5, interval:0, lastReview:null, nextReview:null, lastQuality:null,
      timesUsed:0, lastUsed:null, sortOrder:maxOrder+1 });

}
async function markUsed(){

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ mini Markdown parser (เก็บเป็น text ล้วน → render ตอนแสดง) ============ */
function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdToHtml(src){
  const lines=String(src||'').split('\n');
  let html='', list=null;
  const closeList=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  for(let raw of lines){
    const line=raw.replace(/\s+$/,'');
    let m;
    if(!line.trim()){ closeList(); continue; }
    if(m=line.match(/^(#{1,3})\s+(.*)/)){ closeList(); html+=`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`; }
    else if(m=line.match(/^>\s?(.*)/)){ closeList(); html+=`<blockquote>${mdInline(m[1])}</blockquote>`; }
    else if(m=line.match(/^[-*]\s+(.*)/)){ if(list!=='ul'){closeList();list='ul';html+='<ul>';} html+=`<li>${mdInline(m[1])}</li>`; }
    else if(m=line.match(/^\d+\.\s+(.*)/)){ if(list!=='ol'){closeList();list='ol';html+='<ol>';} html+=`<li>${mdInline(m[1])}</li>`; }
    else { closeList(); html+=`<p>${mdInline(line)}</p>`; }
  }
  closeList();
  return html;
}
function updatePreview(){
  const src=document.getElementById('f-summary');
  const prev=document.getElementById('mdPreview');
  if(!src||!prev) return;
  const val=src.value.trim();
  if(!val){ prev.className='md-prev empty'; prev.textContent='ตัวอย่างจะแสดงที่นี่…'; return; }
  prev.className='md-prev'; prev.innerHTML=mdToHtml(val);
}
function toggleFullPreview(){
  const split=document.querySelector('.md-split'); if(!split) return;
  const btn=document.querySelector('.md-toggle'); if(!btn) return;
  const isFull=split.classList.toggle('full-prev');
  btn.textContent=isFull?'กลับแก้ไข':'ดูเต็มจอ';
  updatePreview();
}
/* คืน URL ถ้าเป็น http/https ที่ปลอดภัย, กันไม่ให้ใส่ javascript: หรืออื่นๆ */
function safeUrl(u){
  const s=String(u||'').trim();
  return /^https?:\/\//i.test(s) ? s : '';
}
function toggleOpenUrl(){
  const inp=document.getElementById('f-url');

  btn.style.display=u?'inline-flex':'none';
}
